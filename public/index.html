<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#FFF7E6">
  <meta name="description" content="서로 알아가는 진모임 퀴즈쇼. 폰으로 답을 쓰고, 익명으로 맞혀 보세요.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <!-- 링크 미리보기(카카오톡 등). og:image 는 절대 주소여야 하므로 도메인을 바꾸면 이 주소도 함께 바꿔야 한다 -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="누구일까? 퀴즈쇼">
  <meta property="og:title" content="누구일까? 퀴즈쇼">
  <meta property="og:description" content="서로 알아가는 진모임 퀴즈쇼 · 비공개로 답 쓰고, 익명으로 맞히고, 한마디 나눠요">
  <meta property="og:image" content="https://enssionworship-group-quiz.0191.workers.dev/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <title>누구일까? 퀴즈쇼</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/common.css">
</head>
<body>
  <main class="page" style="justify-content:center">
    <div class="center">
      <img src="/favicon.svg" alt="" width="76" height="76" style="border-radius:18px">
      <h1 style="font-size:2.2em;margin-top:10px">누구일까?</h1>
      <p class="muted">서로 알아가는 진모임 퀴즈쇼</p>
    </div>
    <form class="card" id="join" style="display:flex;flex-direction:column;gap:12px">
      <label for="code">참가하기 · 방 코드 4자리</label>
      <input class="field" id="code" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="off" placeholder="예) 1234" style="text-align:center;font-size:1.6em;letter-spacing:.2em">
      <button class="btn block" type="submit">입장하기</button>
    </form>
    <a class="btn ghost block" href="/host.html">진행자로 방 만들기</a>
  </main>
  <script type="module">
    document.getElementById('join').addEventListener('submit', (e) => {
      e.preventDefault();
      const code = document.getElementById('code').value.trim();
      if (!/^\d{4}$/.test(code)) return alert('방 코드는 숫자 4자리예요.');
      location.href = `/play.html?code=${code}`;
    });
  </script>
</body>
</html>
