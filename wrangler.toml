name = "enssionworship-group-quiz"
main = "src/index.js"
compatibility_date = "2025-09-01"

# 화면(정적 파일). /api/*, /ws/* 만 Worker 가 처리하고 나머지는 Worker 를 거치지 않고
# 바로 제공된다 → 정적 파일 요청은 Worker 요청 수에 포함되지 않음(무료 요금제에 유리)
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/ws/*"]

# 방마다 Durable Object 1개 (이름 = 4자리 방 코드)
[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

# 무료 요금제는 SQLite 기반 Durable Object 만 사용 가능
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
